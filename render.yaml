services:
  - type: web
    name: financel-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: "sh -c 'uvicorn src.app.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}'"
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app/n100/src"
      # Add any other env vars from .env as needed, e.g.:
      # - key: DATABASE_URL
      #   value: "${DATABASE_URL}"
    healthCheckPath: "/health"
    autoDeploy: true
